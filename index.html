    <style>
      body {
        background-color: #FAFAF9; /* Warm stone */
        color: #1C1917; /* Charcoal */
        -webkit-font-smoothing: antialiased;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      h1, h2, h3, h4, .serif {
        font-family: 'Cormorant Garamond', serif;
      }
      /* Hide scrollbar for clean look */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
    <script>
      // Global error handler
      window.onerror = function(message, source, lineno, colno, error) {
        console.error("Global Error:", message, source, lineno, error);
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#330000;color:#ff9999;padding:20px;z-index:9999;font-family:monospace;font-size:12px;white-space:pre-wrap;';
        errDiv.innerText = 'Startup Error: ' + message + '\n' + (error && error.stack ? error.stack : '');
        document.body.appendChild(errDiv);
      };

      // Process polyfill
      window.process = window.process || { env: {} };
      window.process.env = window.process.env || {};
      if (!window.process.env.NODE_ENV) {
        window.process.env.NODE_ENV = 'production';
      }
    </script>
